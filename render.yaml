services:
  - type: web
    name: caption-web
    runtime: docker
    # Starter (2 GB RAM) is the realistic minimum: the Whisper "base"
    # model + ffmpeg do not fit comfortably in the free tier's 512 MB.
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: WHISPER_MODEL
        value: tiny
      - key: MAX_UPLOAD_MB
        value: "300"
